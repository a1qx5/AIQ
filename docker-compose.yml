services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  docling:
    image: quay.io/docling-project/docling-serve-cpu
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=true

volumes:
  pgdata: